# miwo CI 骨架（Phase 0 / Task 11；Phase 1a / Task 9 追加 mysql job 与「迁移幂等（sqlite）」）
#
# 三个 job 的命令顺序都是**硬约束**，改动前先读这里：
#
#   api：仓库检查 → 路由生成（幂等）→ 迁移幂等（sqlite）→ 类型检查 → 单测 → 后端打包
#     · 仓库检查放在最前面是**快速失败**（fail fast）：它们只读 git 索引与源码、秒级完成，
#       任何一条红了就没必要再花几分钟跑 generate/typecheck/test/build。
#     · ⚠ 这个顺序**与 `apps/web/dist` 无关**。`tools/check-copy.cjs` 把 `apps/web/dist` 放进
#       `mustNotBeTracked`（check-copy.cjs:136），查的是 **git 索引**而不是磁盘存在性 ⇒
#       构建出来的**未跟踪** dist 不会让它失败，**check-copy 在构建之后跑同样是安全的**。
#       （Task 12 修正：这里原来写"它断言 dist 不存在，所以不能在其后跑"——那是**事实错误**。）
#       它另有 `apps/api` 体积上界 40 MB 断言，放在后端打包之前执行更严格。
#     · **`tools/check-tenant-exceptions.cjs` 必须在这里**：它是 Phase 0 的交付物、
#       Phase 1b 隔离策略（`src/db/policies.ts`）的**输入表**，不进 CI 就等于在唯一的自动化
#       环境里零防漂移（谁改了 join/raw/裸 db 导入都不会被发现）。
#     · 本 job **不启动应用**（不跑 `dev` / `start`）：端到端启动验证属 Task 13。
#     · `pnpm install --frozen-lockfile` 是硬依赖：锁文件已入库（Task 5 实测可 frozen 安装）。
#
#   mysql：MySQL 8.4 service container → 迁移验收（8 条断言）→ 集成测试（**不允许 skipped**）
#     · **为什么这个 job 必须存在**：Phase 0 的遗留缺口是"CI 里没有任何非 sqlite 路径"。
#       `tests/mysql-integration.test.ts` 由 `MIWO_TEST_MYSQL=1` 门控（没这个变量整个文件 skip），
#       所以 **job 级 env 必须显式设它**，否则"唯一的自动化环境里 MySQL 分支从来没被跑到"
#       —— 这正是 Phase 0 抓过的"唯一事务守卫永不执行"（Ruling 26）的同族坑。
#       `tools/check-ci-yaml.cjs` 现在把这条钉死（含 `MIWO_TEST_MYSQL` 必须恰好等于 "1"）。
#     · **为什么用 service container 而不是"装一个 mysql"**：GitHub runner 上装 MySQL 要
#       sudo/apt，慢且脆；`services:` 是官方支持的做法。就绪由 service 自己的
#       `--health-cmd`（image 自带的 `mysqladmin ping`）保证：runner 等到 healthy 才开始跑 steps，
#       所以**不需要**（也不该有）一个依赖 runner 上 `mysqladmin` 客户端的前置"等就绪"步骤
#       —— runner 镜像不带 mysql 客户端是常态，加那种步骤比不加更脆。
#     · **口令纪律（Ruling 107）**：绝不复用本机那种"root 无口令"的实例。这里用
#       `MYSQL_ROOT_PASSWORD` + `MYSQL_DATABASE` + 专用账号，并把连接口令经 job 级 `env`
#       传给应用；service 容器只活在本次 job 的网络命名空间里，3306 不对外暴露。
#     · ⚠ **本 job 从未在真 GitHub runner 上跑过**（仓库无 remote，Phase 0 ledger 已如实记录）。
#       现有证据是：① `tools/check-ci-yaml.cjs` 的结构断言；② 本机用**同一组环境变量 + 同一组
#       命令**跑通（apps/api/scripts/verify-mysql-migration.cjs 8/8 + vitest 7 passed / 0 skipped）；
#       ③ 明确声明"真 runner 未验证"。不要把这条写成已验证。
#     · 与 mysql job 一一对应的本机脚本是 `apps/api/scripts/verify-mysql-migration.cjs`
#       （8 条断言；含"空库/空源直接红"的空转护栏，见该文件头）。
#
#   web：build-only（vite build）→ check-no-shadow
#     · **Phase 0 刻意不对 apps/web 做类型检查 —— 这个 job 不跑 `vue-tsc`。**
#       为什么（实测，不是猜测）：修掉 `apps/web/tsconfig.app.json` 里 `ignoreDeprecations` 的无效值
#       （`"6.0"` 在锁定的 TypeScript 5.6.3 下非法）之后，`vue-tsc --build --force` 在仓库内实测仍有
#       **47 条真实类型错误 / 17 个文件**：TS2322 x18、TS2339 x18、TS2307 x5、TS2769 x2、TS7016 x2、
#       TS2739 x1、TS7006 x1（若未先生成 auto-imports/components 的 .d.ts，则是 961 条 / 85 个文件）。
#       错误分类与逐类数量见 `code/miwo/README.md` 的「已知问题」小节。全部是**上游继承缺陷**
#       （迁移前的原前端仓库是同一份继承代码，同样的写法、同样不可用），与 Task 3 的复制无关。
#     · 为什么不在这里修：`apps/web` 是 **Phase 3「前端重绘」要整体替换**的对象 ⇒ 现在投人修这 47 条
#       是**投入将被丢弃的工作**。
#     · 代价怎么记：这一步是**被移除**，不是被掩盖 —— 没有 `continue-on-error`、没有注释掉步骤、
#       没有删 job。代价（47 条的清单 + "Phase 3 重绘的前置项"）明写在 `code/miwo/README.md`
#       的「已知问题 / Known issues」小节；`tools/check-ci-yaml.cjs` 会断言本 job **必须**有
#       `build-only`、且**不得**出现 `vue-tsc`，并断言 README 的追踪项仍在，防止这份说明被删回。
#       **Phase 3 前端重绘完成后，本 job 必须把 `build-only` 换回 `vue-tsc`，类型门禁才算恢复。**
#     · `vite build` 不做类型检查，但它**是**真门禁：幻影依赖（jszip 就是这么被抓到的）、monaco worker
#       打包、singlefile 内联都只有真构建才会暴露。
#     · `apps/web/src/types/{auto-imports,components}.d.ts` 被 `.gitignore` 忽略、全新克隆里**不存在**，
#       由 vite 插件在构建时生成。本 job 不再需要"先 build 再类型检查"的顺序（不跑 vue-tsc 了），
#       但保留这条说明：将来恢复 `vue-tsc` 时它仍然成立。
#     · `check-no-shadow.cjs` **保留**，理由是**结构性**的（不是"构建后 emit 守卫"这句含糊话）：
#       `vue-tsc --build` / 历史上的 `tsc` 可能把 `vite.config.ts` 编译出 `vite.config.js` 落回
#       源码树，而 `vite.config.js` 在 vite 的 `DEFAULT_CONFIG_FILES` 里**排在 `.ts` 之前** ⇒
#       一旦它存在就会**遮蔽真配置**（Task 3 的历史问题：一份过期的 tsc 产物复活过）。
#       `tsconfig.node.json` 的 emit 重定向仍然是它成立的前提。本 job 现在不跑 `vue-tsc`，
#       所以它不再拦"同一次 CI 里刚 emit 出来的影子文件"，而是拦"影子文件被提交进仓库 /
#       被本地工具写回源码树"。
#     · 本 job **不重复**跑仓库检查（含 `check-copy`）：那是 api job 的职责序列，两个 job 各写
#       一份门禁序列迟早会漂移。注意**不是**"dist 存在会让 check-copy 失败"——那条理由是错的
#       （check-copy 查的是索引，构建后跑同样安全），见本文件 api job 的说明。
#
# `pnpm/action-setup` 刻意**不传** `version` 输入：根 `package.json` 已有
# `packageManager: pnpm@10.33.0`，而 action 在两者不一致时会直接抛
# "Multiple versions of pnpm specified"（见 action-setup src/install-pnpm/run.ts）。
#
# 根 `package.json` 的 `typecheck` / `test` 脚本已改为跨平台的裸 `pnpm`（Task 11 修复轮 1，D5），
# 所以它们在 Linux 上也能跑；CI 仍坚持用 `pnpm --filter <pkg> run <script>` **显式点名**，
# 避免根脚本的聚合范围悄悄漂移（web 的脚本名是 `type-check`，不是 `typecheck`，聚合时会静默跳过）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 仓库检查（复制完整性 / 改名 / 行尾 / 原生模块 / 隔离特例清单 / 部署配置一致性）
        run: |
          node tools/check-copy.cjs
          node tools/check-brand.cjs
          node tools/check-eol.cjs
          node tools/check-natives.cjs
          node tools/check-tenant-exceptions.cjs
          pnpm run verify:deploy
          # Phase 1a / Task 11（控制器裁定 B = Ruling 127）：**形态**门禁，禁止
          # "用例体最外层的守卫式 `return;`"（静默早退既不是 pass 也不是 skip，
          # "0 skipped" 这类断言测不到它）。放在这里是因为它只读源码、秒级完成（快速失败序列）。
          node tools/check-test-early-return.cjs
      - name: 路由生成（幂等）
        working-directory: apps/api
        run: node --import=tsx scripts/generate-router.ts
      # Phase 1a / Task 9：让 sqlite 侧的迁移**往返**也在 CI 里被跑到（up 幂等 → down --all → up）。
      # MIWO_DATA_DIR 指到 runner.temp：迁移会在那里建一个一次性的 db2.sqlite，绝不碰仓库里的 data/。
      - name: 迁移幂等（sqlite）
        working-directory: apps/api
        env:
          MIWO_ENV: dev
          MIWO_PORT: "10599"
          MIWO_HOST: 127.0.0.1
          MIWO_DATA_DIR: ${{ runner.temp }}/miwo-ci-data
          MIWO_JWT_SECRET: ci-only-secret-at-least-32-bytes-long-0000
        run: |
          node --env-file-if-exists=.env --import=tsx scripts/db-migrate.ts
          node --env-file-if-exists=.env --import=tsx scripts/db-migrate.ts
          node --env-file-if-exists=.env --import=tsx scripts/db-migrate.ts --down --all
          node --env-file-if-exists=.env --import=tsx scripts/db-migrate.ts
      - name: 类型检查
        run: pnpm --filter @miwo/api run typecheck
      - name: 单测
        run: pnpm --filter @miwo/api test
      - name: 后端打包（产物 data/serve/app.js 已被 .gitignore 忽略）
        run: pnpm --filter @miwo/api run build
      # Phase 1a / Task 11：Phase 1a 的唯一验收命令，**放在最后**。
      # 它会自己起一次迁移（用 %TEMP% 下的一次性 dataDir，绝不碰仓库 data/），所以放在
      # 后端打包之后没有问题（不依赖构建产物）。⚠ 它依赖 apps/api/data/db2.sqlite 的部分
      # （C 组）在 CI 上**必然没有**（gitignored）—— 那种情况下 C 组记的是**显式**结论，
      # 不是静默早退（见脚本头 + tools/check-test-early-return.cjs）。
      # MySQL 口径不由本步覆盖：那条路径归下面的 mysql job（verify-mysql-migration.cjs）。
      - name: Phase 1a 验收（sqlite 口径；MySQL 口径由 mysql job 覆盖）
        run: pnpm run verify:phase1a

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Phase 0 只做构建门禁，不做类型检查：vue-tsc 的 47 条上游继承错误见文件头说明 + README「已知问题」。
      - name: 前端构建（vite build；Phase 0 不做类型检查）
        run: pnpm --filter @miwo/web run build-only
      - name: 构建后守卫：源码树不得出现会遮蔽 vite.config.ts 的文件
        run: node tools/check-no-shadow.cjs

  # ---------------------------------------------------------------------------
  # mysql job：让 **MySQL 分支真的被跑到**（Phase 0 的遗留缺口：CI 从未跑过任何非 sqlite 路径）。
  # 设计理由（service container / healthcheck / 口令纪律 / 真 runner 未验证）见文件头 `mysql：` 一节。
  # ---------------------------------------------------------------------------
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        # 与本机实测的 8.4.11 同一 major；5.x 的 collation/严格模式差异会让断言失去意义。
        image: mysql:8.4
        env:
          # ⚠【Ruling 107】口令是**必需**的：绝不复用本机那种 root 无口令的实例。
          MYSQL_ROOT_PASSWORD: root-ci-password
          MYSQL_DATABASE: miwo_test
          MYSQL_USER: miwo
          MYSQL_PASSWORD: miwo
        ports:
          - 3306:3306
        # 就绪由本 healthcheck 保证：runner 会在 healthy 之后才开始跑 steps。
        # 用 image 自带的 mysqladmin（runner 的宿主镜像**不一定**有 mysql 客户端，
        # 所以刻意**不**加"等 MySQL 就绪"的 step —— 那会依赖一个不存在的工具）。
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      MIWO_ENV: dev
      MIWO_PORT: "10599"
      MIWO_HOST: 127.0.0.1
      MIWO_DATA_DIR: ${{ runner.temp }}/miwo-ci-mysql-data
      MIWO_JWT_SECRET: ci-only-secret-at-least-32-bytes-long-0000
      MIWO_DB_DRIVER: mysql
      MIWO_DB_HOST: 127.0.0.1
      MIWO_DB_PORT: "3306"
      MIWO_DB_USER: miwo
      MIWO_DB_PASSWORD: miwo
      MIWO_DB_NAME: miwo_test
      # ⚠ 这一行是**整个 job 的要点**（Ruling 26 的"必须显式设置"）：少了它，
      #    tests/mysql-integration.test.ts 的 describe.skipIf 会把 7 条用例全部 skip，
      #    job 依然**全绿** —— 那就是"唯一自动化环境里从没跑到 MySQL 分支"。
      #    tools/check-ci-yaml.cjs 断言它存在且恰好是 "1"。
      MIWO_TEST_MYSQL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Phase 1a / Task 11：给 mysql job 造一份**合成**的 dev 库快照。
      # 为什么必须有这一步：`tests/mysql-integration.test.ts` 的"dev sqlite 库 → MySQL 全量搬迁"
      # 用例的源库是 `apps/api/data/db2.sqlite`，而它被 `apps/api/.gitignore` 的 `*.sqlite` 忽略
      # ⇒ 全新 checkout 上不存在。改动前它靠裸 `return;` **静默早退**（既不是 pass 也不是 skip，
      # "0 skipped"那条断言看不见它）；改成 `it.skipIf` 之后它就变成**诚实的一跳**，
      # 而 `verify-mysql-migration.cjs` 的断言 8 会看到 1 skipped 并判红。
      # 与其**放宽断言**，不如**给 CI 一份可用的源库** —— 被跳过的恰恰是"整库搬迁 + 逐表行数 +
      # 分层抽样逐列一致"这条端到端判据，正是最该在自动化环境里被跑到的那一条。
      # ⚠ 生成物是 `*.sqlite`（.gitignore 覆盖）⇒ `tools/check-copy.cjs` 查 git 索引，不受影响。
      - name: 生成合成 dev 库快照（供 MySQL 搬迁用例；仓库里没有真库，它被 gitignore）
        working-directory: apps/api
        run: node scripts/gen-dev-db-fixture.cjs
      - name: MySQL 迁移验收（8 条断言；空库直接红）
        working-directory: apps/api
        run: node scripts/verify-mysql-migration.cjs
      - name: MySQL 集成测试（不允许 skipped）
        working-directory: apps/api
        run: pnpm exec vitest run tests/mysql-integration.test.ts --reporter=verbose
        # 这里不写 `|| true`、也不写 continue-on-error —— 掩盖不是通过。
        # 与上面 verify 脚本的断言 8 是**两条独立**的护栏：脚本内部用 require.resolve 解析
        # vitest 入口并断言"0 skipped"；这一步是 CI 层面的同一份测试再跑一次（verbose 便于看用例名）。
