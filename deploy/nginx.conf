# 谜沃 / MirrorWorld 反向代理（spec §10.3）
#
# 运行位置（修复轮 1，F1）：**宿主机上的 nginx**，不是容器。
#   后端在 MIWO_ENV=prod 下只监听 127.0.0.1（apps/api/src/config.ts:84-86 强制），
#   容器内的 api 用 host 网络模式（见 deploy/docker-compose.yml 文件头），
#   因此宿主机 nginx 直接反代 http://127.0.0.1:<MIWO_PORT> 是唯一可达路径。
#   若将来把 nginx 也放进容器：必须让 nginx 共享 api 的网络命名空间
#   （`network_mode: "service:api"`）；那种形态下 proxy_pass 仍写 127.0.0.1:<MIWO_PORT>
#   （同一个网络命名空间里的回环），本文件不需要改。
#
# ⚠ 端口联动（修复轮 1，F3）：本文件共 **3 处** `proxy_pass http://127.0.0.1:10588`
#   （location /api、/oss、/socket.io 各一处），必须与 deploy/.env.example 的 MIWO_PORT 一致；
#   tools/check-deploy-config.cjs 会**逐处**断言。改 MIWO_PORT 时这三处都要同步改。
#
# ⚠ 宿主机路径按实际部署位置调整：
#   · 证书：ssl_certificate / ssl_certificate_key 下面写的是 /etc/nginx/certs/{fullchain.pem,privkey.pem}。
#     deploy/certs/ 已被 .gitignore 忽略（私钥**不要**入库），它只是仓库内的暂存目录，
#     正式部署推荐直接放到 /etc/nginx/certs/。
#   · 前端静态根：唯一真相是 `${MIWO_DATA_DIR}/web`（模板默认 `/var/lib/miwo/data/web`），
#     后端 app.ts 的 `getPath("web")` 也使用同一目录。先构建前端，再用
#     `apps/api/scripts/sync-web-build.cjs` 将白名单产物同步进去；未同步时 `/` 会是 404。

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 20m;

  # 前端静态站点：与 systemd 的 MIWO_DATA_DIR 同源，唯一根目录是 MIWO_DATA_DIR/web。
  # sync-web-build.cjs 将构建产物放入这里；hash 文件名与长缓存属于 Phase 3。
  root /var/lib/miwo/data/web;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api {
    proxy_pass http://127.0.0.1:10588;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # 媒体：必须支持 Range（视频拖动进度条），交给后端受控下载。
  # /oss 需要 ?exp=&sig= 短时签名或 ?token=；匿名访问返回 401，Range 由后端处理（206）。
  location /oss {
    proxy_pass http://127.0.0.1:10588;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
  }

  location /socket.io {
    proxy_pass http://127.0.0.1:10588;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
