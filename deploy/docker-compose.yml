# 谜沃 / MirrorWorld 单机容器编排（Phase 0 交付；worker 服务自 Phase 1d 起是**真服务**，见文件末）
#
# ⚠ 拓扑为什么是"api 用 host 网络 + nginx 跑宿主机"（修复轮 1，F1）：
#   apps/api/src/config.ts:84-86 在 MIWO_ENV=prod 下**强制** MIWO_HOST === "127.0.0.1"（否则启动抛 ConfigError），
#   而 apps/api/src/app.ts:200 用 config.host 作为 server.listen 的绑定地址 →
#   容器内的 api **只监听容器自己的回环**。
#   于是"用 compose 的 ports 把容器端口发布到宿主机"是**走不通的**：Docker 的端口发布走 DNAT / docker-proxy，
#   连接落在容器 eth0 上，而绑在容器 lo 上的 socket 永远收不到（经典坑）。
#   两种自洽写法（二者必居其一，tools/check-deploy-config.cjs 会断言）：
#     A) 本文件采用：api 用 `network_mode: host` → 它直接绑**宿主机**的 127.0.0.1:${MIWO_PORT}，
#        宿主机 nginx 反代 http://127.0.0.1:${MIWO_PORT} 即可连通（见 deploy/nginx.conf）。
#        ⚠ network_mode 与 ports **不能并存**（docker compose 会直接报错），所以 api 没有 ports 段。
#     B) 若将来要把 nginx 也放进容器：必须让 nginx 共享 api 的网络命名空间
#        （nginx 服务写 `network_mode: "service:api"`，此时 80/443 要发布在 **api** 服务的 ports 上）。
#   Phase 0 的 nginx 一律跑在**宿主机**（deploy/nginx.conf 就是给它的，proxy_pass 指 127.0.0.1）。
#   MySQL 由 1Panel 独立管理；api/worker 通过 .env 的 MIWO_DB_HOST/MIWO_DB_PORT 连接宿主机可达的实例。
#   MIWO_DATA_DIR 以同路径 bind mount，保证宿主机 nginx 能读取容器播种的 web 静态文件。
name: miwo

services:
  api:
    image: miwo-api:${MIWO_IMAGE_TAG}
    build:
      # 构建上下文 = 仓库根（本文件在 deploy/ 下）；deploy/Dockerfile 里的 COPY 路径都相对仓库根。
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      MIWO_ENV: ${MIWO_ENV}
      MIWO_PORT: ${MIWO_PORT}
      MIWO_HOST: ${MIWO_HOST}
      MIWO_DATA_DIR: ${MIWO_DATA_DIR}
      MIWO_JWT_SECRET: ${MIWO_JWT_SECRET}
      MIWO_STORAGE_DRIVER: ${MIWO_STORAGE_DRIVER:-local}
      MIWO_S3_BUCKET: ${MIWO_S3_BUCKET:-}
      MIWO_S3_REGION: ${MIWO_S3_REGION:-}
      MIWO_S3_ENDPOINT: ${MIWO_S3_ENDPOINT:-}
      MIWO_S3_ACCESS_KEY_ID: ${MIWO_S3_ACCESS_KEY_ID:-}
      MIWO_S3_SECRET_ACCESS_KEY: ${MIWO_S3_SECRET_ACCESS_KEY:-}
      MIWO_S3_SESSION_TOKEN: ${MIWO_S3_SESSION_TOKEN:-}
      MIWO_S3_FORCE_PATH_STYLE: ${MIWO_S3_FORCE_PATH_STYLE:-false}
    # 见文件头 A)：让 api 直接绑宿主机回环，宿主机 nginx 才连得上。不能与 ports 并存。
    network_mode: host
    volumes:
      - "${MIWO_DATA_DIR}:${MIWO_DATA_DIR}"
    # 首次启动播种运行时素材并发布静态文件到宿主机 nginx 可读的同一目录。
    command:
      - sh
      - -c
      - >-
        node scripts/seed-data-dir.cjs --src /app/apps/api/data --out "$$MIWO_DATA_DIR" &&
        mkdir -p "$$MIWO_DATA_DIR/web" &&
        cp -a /app/apps/api/data/web/. "$$MIWO_DATA_DIR/web/" &&
        exec node data/serve/app.js

  # Phase 1d：队列 worker。与 api 同镜像/同 env；只换启动命令。
  # ⚠ 生产用哪个形态：Phase 0 的裁定是 **systemd 为主推**（容器路径整体未在真机验证过）。
  #    本服务与 systemd 单元二选一，不要同时起（两条进程抢同一队列没事，但会让并发口径翻倍）。
  worker:
    image: miwo-api:${MIWO_IMAGE_TAG}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      MIWO_ENV: ${MIWO_ENV}
      MIWO_PORT: ${MIWO_PORT}
      MIWO_HOST: ${MIWO_HOST}
      MIWO_DATA_DIR: ${MIWO_DATA_DIR}
      MIWO_JWT_SECRET: ${MIWO_JWT_SECRET}
      MIWO_STORAGE_DRIVER: ${MIWO_STORAGE_DRIVER:-local}
      MIWO_S3_BUCKET: ${MIWO_S3_BUCKET:-}
      MIWO_S3_REGION: ${MIWO_S3_REGION:-}
      MIWO_S3_ENDPOINT: ${MIWO_S3_ENDPOINT:-}
      MIWO_S3_ACCESS_KEY_ID: ${MIWO_S3_ACCESS_KEY_ID:-}
      MIWO_S3_SECRET_ACCESS_KEY: ${MIWO_S3_SECRET_ACCESS_KEY:-}
      MIWO_S3_SESSION_TOKEN: ${MIWO_S3_SESSION_TOKEN:-}
      MIWO_S3_FORCE_PATH_STYLE: ${MIWO_S3_FORCE_PATH_STYLE:-false}
    # 与 api 一致：prod 下后端只绑回环，host 网络是唯一自洽写法（见文件头 A）。
    network_mode: host
    volumes:
      - "${MIWO_DATA_DIR}:${MIWO_DATA_DIR}"
    command: ["node", "data/serve/worker.js"]
