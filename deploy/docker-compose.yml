# 谜沃 / MirrorWorld 单机容器编排（Phase 0 交付；worker 服务自 Phase 1d 起是**真服务**，见文件末）
#
# ⚠ 拓扑为什么是"api 用 host 网络 + nginx 跑宿主机"（修复轮 1，F1）：
#   apps/api/src/config.ts:84-86 在 MIWO_ENV=prod 下**强制** MIWO_HOST === "127.0.0.1"（否则启动抛 ConfigError），
#   而 apps/api/src/app.ts:200 用 config.host 作为 server.listen 的绑定地址 →
#   容器内的 api **只监听容器自己的回环**。
#   于是"用 compose 的 ports 把容器端口发布到宿主机"是**走不通的**：Docker 的端口发布走 DNAT / docker-proxy，
#   连接落在容器 eth0 上，而绑在容器 lo 上的 socket 永远收不到（经典坑）。
#   两种自洽写法（二者必居其一，tools/check-deploy-config.cjs 会断言）：
#     A) 本文件采用：api 用 `network_mode: host` → 它直接绑**宿主机**的 127.0.0.1:${MIWO_PORT}，
#        宿主机 nginx 反代 http://127.0.0.1:${MIWO_PORT} 即可连通（见 deploy/nginx.conf）。
#        ⚠ network_mode 与 ports **不能并存**（docker compose 会直接报错），所以 api 没有 ports 段。
#     B) 若将来要把 nginx 也放进容器：必须让 nginx 共享 api 的网络命名空间
#        （nginx 服务写 `network_mode: "service:api"`，此时 80/443 要发布在 **api** 服务的 ports 上）。
#   Phase 0 的 nginx 一律跑在**宿主机**（deploy/nginx.conf 就是给它的，proxy_pass 指 127.0.0.1）。
name: miwo

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MIWO_MYSQL_ROOT_PASSWORD}
      # 修复轮 1（F13）：口令通过环境变量递给客户端工具，healthcheck 的命令行里不再出现 -p<口令>
      #（否则 `docker inspect` 与容器内 `ps` 的 argv 都能读到）。mysqladmin 会自动读 MYSQL_PWD。
      MYSQL_PWD: ${MIWO_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MIWO_DB_NAME}
      MYSQL_USER: ${MIWO_DB_USER}
      MYSQL_PASSWORD: ${MIWO_DB_PASSWORD}
    ports:
      # 只发布到**宿主机回环**：host 网络模式的 api 通过 127.0.0.1:${MIWO_DB_PORT} 连它，公网/局域网都连不上。
      # 宿主端口用 MIWO_DB_PORT，保证"应用要连的端口"与"实际发布的端口"同源。
      # ⚠【已更正·Ruling 8+16】旧注释写"Phase 1a 之前应用根本不消费这一组变量（MIWO_DB_DRIVER 只在
      # config.ts 里被读取；真实数据在 ${MIWO_DATA_DIR}/db2.sqlite）" —— **那是假的**。
      # Phase 1a / Task 4 起启动路径是 utils/db.ts 的 dbReady → src/db/connect.ts 的 connect()，
      # createKnex() 按 config.db.driver 选 client（sqlite→better-sqlite3 / mysql→mysql2），
      # 这组变量正是它的输入 ⇒ 设了 MIWO_DB_DRIVER=mysql 就是在用 MySQL（真实数据在下面的 mysql 卷里）。
      # 详见 deploy/README.md 第 6 节。
      - "127.0.0.1:${MIWO_DB_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 修复轮 1（F13）：不带任何口令参数，靠上面的 MYSQL_PWD。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: miwo-api:${MIWO_IMAGE_TAG}
    build:
      # 构建上下文 = 仓库根（本文件在 deploy/ 下）；deploy/Dockerfile 里的 COPY 路径都相对仓库根。
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      MIWO_ENV: ${MIWO_ENV}
      MIWO_PORT: ${MIWO_PORT}
      MIWO_HOST: ${MIWO_HOST}
      MIWO_DATA_DIR: ${MIWO_DATA_DIR}
      MIWO_JWT_SECRET: ${MIWO_JWT_SECRET}
    # 见文件头 A)：让 api 直接绑宿主机回环，宿主机 nginx 才连得上。不能与 ports 并存。
    network_mode: host
    volumes:
      - miwo-data:${MIWO_DATA_DIR}
    depends_on:
      mysql:
        condition: service_healthy

  # Phase 1d：队列 worker。与 api 同镜像/同 env；只换启动命令。
  # ⚠ 生产用哪个形态：Phase 0 的裁定是 **systemd 为主推**（容器路径整体未在真机验证过）。
  #    本服务与 systemd 单元二选一，不要同时起（两条进程抢同一队列没事，但会让并发口径翻倍）。
  worker:
    image: miwo-api:${MIWO_IMAGE_TAG}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      MIWO_ENV: ${MIWO_ENV}
      MIWO_PORT: ${MIWO_PORT}
      MIWO_HOST: ${MIWO_HOST}
      MIWO_DATA_DIR: ${MIWO_DATA_DIR}
      MIWO_JWT_SECRET: ${MIWO_JWT_SECRET}
    # 与 api 一致：prod 下后端只绑回环，host 网络是唯一自洽写法（见文件头 A）。
    network_mode: host
    volumes:
      - miwo-data:${MIWO_DATA_DIR}
    command: ["node", "data/serve/worker.js"]
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  miwo-data:
